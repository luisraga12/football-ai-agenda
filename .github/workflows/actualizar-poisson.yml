# Actualizar datos, Poisson, momios y EV (Football AI Agenda)
#
# Corre la automatizacion de la semana actual y, si los datos cambiaron,
# hace commit de los archivos generados en `data/`.
#
# - Diario (13:17 UTC): recalcula la semana actual con los últimos
#   datos de ESPN (últimos 5 de cada equipo — 4 en competiciones
#   europeas —, promedios de liga, momios y EV). Los momios del fin
#   de semana siguiente aparecen solos cuando DraftKings/Bet 365 los
#   publican en ESPN.
# - Cada hora en días de partido (vie, sáb y dom): para que los
#   resultados y los últimos 5 se actualicen solos mientras se juega.
# - Manual (`workflow_dispatch`): para probar o forzar una corrida.
#
# El paso "Publicar cambios" hace `git add data/ scripts/config/`:
# el config TAMBIÉN se commitea, porque el descubrimiento (paso 0)
# lo modifica cuando ESPN publica un partido tarde. Lección de la
# Liguilla, 24 nov 2026 (Semana 7): la corrida c892956 descubrió los
# 8 cuartos de final y los puso en el ev.json, pero el workflow solo
# hacía `git add data/` y el cambio al config se perdió; la línea
# base ya los traía, así que en la siguiente corrida no se
# re-agregaron y el pipeline los sacó del ev.json. Sin el commit del
# config, el descubrimiento solo dura una corrida.
#
# La semana que se calcula es la de `scripts/config/semana-actual.json`.
# Para cambiar de semana, ese archivo debe apuntar a la configuración
# nueva (p. ej. copiar `semana-2.json` sobre `semana-actual.json`).
# Si existe el config de entre semana de esa semana
# (`scripts/config/semana-<N>-entresemana.json`), se calcula también
# en la misma corrida; si no existe, la corrida sigue solo con el fin
# de semana (así los momios/EV entre semana no se quedan congelados).
#
# NOTA: los workflows programados (`schedule`) solo corren en la rama
# por defecto (`main`).
#
# Los pasos (descubrimiento, datos, Poisson, tabla, momios, EV) los
# corre `scripts/run_semana.py`; el workflow no repite la lista para
# no desincronizarse con el orquestador. El descubrimiento (paso 0)
# revisa cada corrida si ESPN publicó partidos nuevos en la semana
# corriente y los agrega al config; la primera corrida de cada config
# solo establece la línea base.
#
# El workflow usa `GITHUB_TOKEN` y el secreto opcional `BSD_TOKEN`
# (token pelado de Bzzoiro; si no existe, recolectar_momios.py salta la
# segunda fuente sin romper nada y los datos siguen viniendo de ESPN).
# Ninguna clave se publica: los datos se consultan en privado.
name: Actualizar datos, Poisson, momios y EV

on:
  schedule:
    - cron: '17 13 * * *'        # diario, 13:17 UTC (07:17 CST)
    - cron: '0 * * * 5,6,0'     # cada hora vie/sáb/dom (días de partido)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Registrar hora de arranque
        run: |
          echo "schedule=${{ github.event.schedule}}"
          date -u +"%Y-%m-%d %H:%M:%S UTC"
          date +"%Y-%m-%d %H:%M:%S %Z"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calcular semana actual
        run: python3 scripts/run_semana.py --config scripts/config/semana-actual.json
      - name: Calcular entre semana (si hay config)
        run: |
          SEMANA=$(python3 -c "import json; print(json.load(open('scripts/config/semana-actual.json'))['semana'])")
          CFG="scripts/config/semana-${SEMANA}-entresemana.json"
          if [ -f "$CFG" ]; then
            python3 scripts/run_semana.py --config "$CFG"
          else
            echo "Sin config entre semana para semana ${SEMANA}; solo fin de semana."
          fi
      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/config/
          git diff --cached --quiet || git commit -m "Actualizar datos y Poisson (auto)"
          git push
