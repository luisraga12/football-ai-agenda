# Regenerar data/mapas.json: estadio + alineación oficial (Semana 10)
#
# Workflow ligero: solo corre scripts/generar_mapas.py, que consulta el
# summary de ESPN por evento y publica el estadio (gameInfo.venue) y la
# alineación oficial (rosters, starter) en data/mapas.json.
#
# Cada hora SOLO en ventanas de partido entre semana (horas UTC;
# America/Mexico_City es UTC-6 en noviembre):
#   - mar-vie 00:00-04:00 UTC (18:00-22:00 CST del día anterior):
#     noches de Liga MX; las alineaciones se publican ~1 h antes del
#     saque inicial.
#   - mar-vie 17:00-23:00 UTC (11:00-17:00 CST): tardes europeas
#     (Champions/Europa League entre semana).
# El fin de semana ya lo cubre actualizar-poisson.yml (cada hora
# vie/sáb/dom) y la corrida diaria 13:17 UTC regenera los mapas con
# el resto de los datos. Los workflows programados solo corren en
# `main`. Solo se hace commit si mapas.json cambió; si ESPN falla, el
# script deja estadio en null y alineacion_publicada en false
# (fail-soft) y no se escribe nada roto.
name: Actualizar mapas (estadio y alineación)

on:
  schedule:
    - cron: '0 0-4,17-23 * * 2,3,4,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mapas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar data/mapas.json
        run: python3 scripts/generar_mapas.py
      - name: Calcular Fuerza del XI oficial
        run: python3 scripts/calcular_fuerza_oficial.py
      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mapas.json
          git add data/fuerza_xi.json
          git diff --cached --quiet || git commit -m "Actualizar mapas: estadio y alineación oficial (auto)"
          git push
