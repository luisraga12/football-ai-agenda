<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview: estadísticas y tabla en el detalle — Football AI Agenda</title>
<style>
:root{
--bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#E9EEE1; --surface-3:#DDE6CF;
--ink:#11160E; --ink-2:#3D4738; --muted:#66725E; --line:#D8E0CC;
--accent:#5E8F06; --accent-strong:#4A7303; --accent-soft:#E4F0C8; --on-accent:#FFFFFF;
--amber:#B54708; --amber-soft:#FEF3E2;
--shadow:0 10px 30px rgba(20,35,8,.10);
--radius:18px;
}
@media (prefers-color-scheme: dark){
:root{
--bg:#090C08; --surface:#12160F; --surface-2:#1A2015; --surface-3:#242E1E;
--ink:#F1F5E9; --ink-2:#CBD6BE; --muted:#93A187; --line:#28331F;
--accent:#BFE84A; --accent-strong:#D2F76B; --accent-soft:#26351A; --on-accent:#141C06;
--amber:#FDBA74; --amber-soft:#3A2A14;
--shadow:0 10px 30px rgba(0,0,0,.45);
}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif;line-height:1.08;margin:0}
p{margin:0}
a{color:var(--accent-strong);font-weight:800;text-decoration:none}
.num{font-family:"Archivo Narrow","Archivo",sans-serif;font-variant-numeric:tabular-nums}
.det-page{max-width:860px;margin:0 auto;padding:0 18px 40px}
.det-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-top:18px}
.det-section h2{font-size:1.25rem;margin:0 0 4px}
.det-section h4{font-size:1.05rem;margin:0 0 10px}
.detail-note{color:var(--muted);font-size:.78rem;margin-top:16px}
.detail-pending{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:12px;padding:12px 14px;font-size:.88rem}
.detail-pos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.detail-pos{grid-template-columns:1fr}}
.detail-pos .pos-box{background:var(--surface-2);border-radius:12px;padding:12px}
.detail-pos .pos-num{font-size:1.5rem;font-weight:900}
.detail-pos p{color:var(--muted);font-size:.85rem;font-weight:700}
.radio-head{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:.9rem;margin-bottom:12px}
.radio-head .radio-vs{color:var(--muted);font-weight:800}
.radio-metric{margin-bottom:12px}
.radio-row{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center}
.radio-num{text-align:center}
.radio-track{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.radio-fill{height:100%;border-radius:999px}
.radio-home{background:var(--accent-strong)}
.radio-track-r{display:flex;justify-content:flex-end}
.radio-away{background:var(--amber)}
.radio-cap{text-align:center;color:var(--muted);font-size:.78rem;font-weight:700;margin-top:4px}
.det-loading{color:var(--muted);font-weight:700;padding:24px 0}
.preview-note{font-size:.88rem;color:var(--muted);margin-top:10px}
.preview-note b{color:var(--ink)}
.preview-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.preview-links a{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 12px;font-size:.85rem}
</style>
</head>
<body>
<main class="det-page" id="preview">
<p class="det-loading">Cargando el preview…</p>
</main>
<script>
"use strict";
/* Preview — Séptima ronda, Tarea 2 (Empleado 2, 26 nov 2026).
   Render de estadísticas y tabla en el detalle, con las MISMAS funciones
   y clases propias de partido.html (statsBlock, standingsBlock, posBox,
   radioRow, STATS_ORDEN, STATS_ETIQUETAS). Datos reales: data/mapas.json
   (standings 51/55, PR #75) y data/semana-2-entresemana/estadisticas.json
   (15 partidos terminados) + data/semana-2/estadisticas.json (0 terminados).
   Única diferencia intencional con partido.html: el texto de
   "Estadísticas pendientes" ya NO promete "duelos ganados": ESPN no
   publica duelos (reporte E1, 26 nov ~10:02), así que no se inventa.
   Pruebas: ?partido=galatasaray-vs-aston-villa (stats + tabla),
   ?partido=monterrey-vs-america (stats + tabla),
   ?partido=werder-bremen-vs-borussia-monchengladbach (sin stats),
   ?partido=juventus-vs-omonia-nicosia (sin tabla). Los previews nunca van a main. */
var root = document.getElementById("preview");
var params = new URLSearchParams(window.location.search);
var slug = (params.get("partido") || "galatasaray-vs-aston-villa").trim().toLowerCase();
var ALT_BASE = "https://luisraga12.github.io/football-ai-agenda";
var DETAIL = {};
function norm(s){ return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fetchJSON(url){
  if (typeof fetch !== "function") return Promise.resolve(null);
  var timeout = new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, 10000); });
  var req = fetch(url).then(function(r){
    if (!r || !r.ok) return null;
    return r.json().then(function(j){ return j; }, function(){ return null; });
  }, function(){ return null; });
  return Promise.race([req, timeout]);
}
function cargarJSON(rel){
  return fetchJSON(rel).then(function(j){
    if (j) return j;
    return fetchJSON(ALT_BASE + "/" + rel);
  });
}
var LIGAS = {
"champions league": {code: "ucl", display: "Champions League"},
"uefa.champions": {code: "ucl", display: "Champions League"},
"ucl": {code: "ucl", display: "Champions League"},
"europa league": {code: "uel", display: "Europa League"},
"uefa.europa": {code: "uel", display: "Europa League"},
"uel": {code: "uel", display: "Europa League"},
"laliga": {code: "laliga", display: "LaLiga"},
"esp.1": {code: "laliga", display: "LaLiga"},
"premier league": {code: "premier", display: "Premier League"},
"eng.1": {code: "premier", display: "Premier League"},
"serie a": {code: "seriea", display: "Serie A"},
"ita.1": {code: "seriea", display: "Serie A"},
"bundesliga": {code: "bundes", display: "Bundesliga"},
"ger.1": {code: "bundes", display: "Bundesliga"},
"liga mx": {code: "ligamx", display: "Liga MX"},
"mex.1": {code: "ligamx", display: "Liga MX"},
"ligamx": {code: "ligamx", display: "Liga MX"}
};
function ligaInfo(liga){
  var key = (liga || "").toLowerCase().replace(/\s+/g, " ").trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (LIGAS[key]) return LIGAS[key];
  return {code: norm(liga || "liga") || "liga", display: liga || "Liga"};
}
var STATS_ETIQUETAS = {
posesion: "Posesión", tiros: "Tiros", tiros_a_puerta: "Tiros a puerta",
tiros_fuera: "Tiros fuera", duelos_ganados: "Duelos ganados",
corners: "Córners", faltas: "Faltas", fueras_de_juego: "Fueras de juego",
tarjetas_amarillas: "Tarjetas amarillas", tarjetas_rojas: "Tarjetas rojas",
pases: "Pases", pases_precisos: "Pases precisos", pases_clave: "Pases clave",
entradas: "Entradas", despejes: "Despejes", paradas: "Paradas",
centros: "Centros", tiros_bloqueados: "Tiros bloqueados"
};
var STATS_ORDEN = ["posesion", "tiros", "tiros_a_puerta", "duelos_ganados",
"corners", "faltas", "fueras_de_juego", "tarjetas_amarillas",
"tarjetas_rojas", "pases_precisos", "paradas"];
function normalizarStats(raw){
  var lista = [];
  if (Array.isArray(raw)){
    raw.forEach(function(s){
      if (!s || typeof s.local !== "number" || typeof s.visita !== "number") return;
      lista.push({clave: s.clave || "", etiqueta: s.etiqueta || STATS_ETIQUETAS[s.clave] || s.clave, local: s.local, visita: s.visita, unidad: s.unidad || ""});
    });
  } else if (raw && typeof raw === "object"){
    Object.keys(raw).forEach(function(k){
      var v = raw[k], l = null, vv = null, u = "";
      if (Array.isArray(v) && v.length >= 2){ l = v[0]; vv = v[1]; }
      else if (v && typeof v === "object"){ l = v.local; vv = v.visita; u = v.unidad || ""; }
      if (typeof l !== "number" || typeof vv !== "number") return;
      lista.push({clave: k, etiqueta: STATS_ETIQUETAS[k] || k, local: l, visita: vv, unidad: u});
    });
  }
  lista.sort(function(a, b){
    var ia = STATS_ORDEN.indexOf(a.clave), ib = STATS_ORDEN.indexOf(b.clave);
    if (ia === -1) ia = 99;
    if (ib === -1) ib = 99;
    return ia - ib;
  });
  return lista;
}
function buscarStats(docs, slug){
  var found = null;
  docs.forEach(function(doc){
    if (!doc || !Array.isArray(doc.partidos)) return;
    doc.partidos.forEach(function(p){
      if (!p) return;
      var key = p.slug ? String(p.slug).toLowerCase() : (norm(p.local) + "-vs-" + norm(p.visita));
      if (key === slug) found = p;
    });
  });
  return found;
}
function radioRow(label, hVal, aVal, hW, aW){
  return '<div class="radio-metric">' +
  '<div class="radio-row">' +
  '<b class="radio-num">' + esc(hVal) + '</b>' +
  '<div class="radio-track"><div class="radio-fill radio-home" style="width:' + hW + '%"></div></div>' +
  '<div class="radio-track radio-track-r"><div class="radio-fill radio-away" style="width:' + aW + '%"></div></div>' +
  '<b class="radio-num">' + esc(aVal) + '</b>' +
  '</div>' +
  '<div class="radio-cap">' + esc(label) + '</div>' +
  '</div>';
}
function posBox(teamName, league, st){
  if (!st){
    return '<div class="pos-box"><b>' + esc(teamName) + '</b><p>pendiente</p></div>';
  }
  return '<div class="pos-box"><b>' + esc(teamName) + '</b>' +
  '<div class="pos-num num">' + esc(st.pos) + '.º</div>' +
  '<p>' + esc(league) + ' · ' + esc(st.pts) + ' pts · ' + esc(st.pj) + ' PJ · ' +
  esc(st["récord"]) + ' · DG ' + esc(st.dg) + '</p></div>';
}
function standingsBlock(key, home, away){
  var h = "<h4>Posición en la tabla</h4><div class=\"detail-pos\">";
  var d = DETAIL[key] || null;
  if (d && d.standings){ h += posBox(home, d.league, d.standings.home) + posBox(away, d.league, d.standings.away); }
  else { h += posBox(home, "", null) + posBox(away, "", null); }
  h += "</div>";
  return h;
}
function statsBlock(estDocs, slug, home, away){
  var h = "<h4>Estadísticas del partido</h4>";
  var p = buscarStats(estDocs, slug);
  if (!p || !p.estadisticas){
    return h + '<div class="detail-pending">Estadísticas pendientes — el Empleado 1 aún no publica el JSON de estadísticas (data/&lt;config&gt;/estadisticas.json). Cuando llegue, esta sección muestra posesión, tiros, tiros a puerta, córners y el resto en barras comparadas.</div>';
  }
  var lista = normalizarStats(p.estadisticas);
  if (!lista.length){
    return h + '<div class="detail-pending">Estadísticas pendientes — el archivo de estadísticas no trae estadísticas con valores para este partido.</div>';
  }
  h += '<div class="radio-head"><span>' + esc(home) + '</span><span class="radio-vs">vs</span><span>' + esc(away) + '</span></div>';
  lista.forEach(function(s){
    var esPct = (s.unidad === "%") || (s.clave === "posesion");
    var fmt = function(v){ return esPct ? (Math.round(v * 10) / 10) + "%" : String(v); };
    var hw, aw;
    if (esPct){
      hw = Math.max(0, Math.min(100, Math.round(s.local)));
      aw = Math.max(0, Math.min(100, Math.round(s.visita)));
    } else {
      var mx = Math.max(s.local, s.visita);
      hw = mx ? Math.round(s.local / mx * 100) : 0;
      aw = mx ? Math.round(s.visita / mx * 100) : 0;
    }
    h += radioRow(s.etiqueta, fmt(s.local), fmt(s.visita), hw, aw);
  });
  h += '<p class="detail-note">Estadísticas del partido terminado, según ESPN (resumen del partido). Posesión en %; el resto, en jugadas.</p>';
  return h;
}
function enlacesPrueba(){
  return '<a href="?partido=galatasaray-vs-aston-villa">Galatasaray vs Aston Villa</a>' +
  '<a href="?partido=monterrey-vs-america">Monterrey vs América</a>' +
  '<a href="?partido=werder-bremen-vs-borussia-monchengladbach">Werder vs Gladbach</a>' +
  '<a href="?partido=juventus-vs-omonia-nicosia">Juventus vs Omonia</a>';
}
function main(){
  Promise.all([
    cargarJSON("data/mapas.json"),
    cargarJSON("data/semana-2-entresemana/estadisticas.json"),
    cargarJSON("data/semana-2/estadisticas.json")
  ]).then(function(res){
    var mapas = res[0], estDocs = [res[1], res[2]];
    if (mapas && mapas.detalle){
      Object.keys(mapas.detalle).forEach(function(k){
        var dd = mapas.detalle[k];
        var pv = (mapas.partidos_vivo && mapas.partidos_vivo[k]) || null;
        DETAIL[k] = {
          home: dd.home, away: dd.away,
          league: dd.league || (pv ? ligaInfo(pv.liga).display : ""),
          standings: dd.standings || null
        };
      });
    }
    var d = DETAIL[slug] || null;
    var home = d ? d.home : "", away = d ? d.away : "";
    if (!home || !away){
      var pe = buscarStats(estDocs, slug);
      if (pe){ home = pe.local; away = pe.visita; }
    }
    if (!home || !away){
      root.innerHTML = '<div class="det-section"><h2>Partido no encontrado</h2><p class="preview-note">Sin partido con ese identificador (' + esc(slug) + '). Prueba con uno de los enlaces de abajo.</p><div class="preview-links">' + enlacesPrueba() + '</div></div>';
      return;
    }
    var h = '<div class="det-section"><h2>' + esc(home) + ' vs ' + esc(away) + '</h2>' +
    '<p class="preview-note">Preview de la Tarea 2 (séptima ronda, Empleado 2, 26 nov 2026): mismo render que <b>partido.html</b>, con datos reales del PR #75. Si un dato no existe, la sección lo dice; nada se inventa.</p>' +
    '<p class="preview-note"><a href="partido.html?partido=' + esc(slug) + '">Ver este mismo partido en partido.html</a></p></div>';
    h += '<div class="det-section">' + standingsBlock(slug, home, away) + '</div>';
    h += '<div class="det-section">' + statsBlock(estDocs, slug, home, away) + '</div>';
    h += '<div class="det-section"><h2>Partidos de prueba</h2><div class="preview-links">' + enlacesPrueba() + '</div>' +
    '<p class="detail-note">Datos: data/mapas.json y data/&lt;config&gt;/estadisticas.json (Empleado 1, PR #75, 26 nov 2026). Los previews nunca van a main.</p></div>';
    root.innerHTML = h;
  });
}
main();
</script>
</body>
</html>
