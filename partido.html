<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Detalle del partido — Football AI Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet" />
<style>

  :root{
    --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#E9EEE1; --surface-3:#DDE6CF;
    --ink:#11160E; --ink-2:#3D4738; --muted:#66725E; --line:#D8E0CC;
    --accent:#5E8F06; --accent-strong:#4A7303; --accent-soft:#E4F0C8; --on-accent:#FFFFFF;
    --blue:#1D6FE0; --blue-soft:#DFEBFC;
    --live:#D92D20; --live-soft:#FDE8E6;
    --amber:#B54708; --amber-soft:#FEF3E2;
    --hero-ink:#F5F8EE;
    --shadow:0 10px 30px rgba(20,35,8,.10);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#090C08; --surface:#12160F; --surface-2:#1A2015; --surface-3:#242E1E;
      --ink:#F1F5E9; --ink-2:#CBD6BE; --muted:#93A187; --line:#28331F;
      --accent:#BFE84A; --accent-strong:#D2F76B; --accent-soft:#26351A; --on-accent:#141C06;
      --blue:#6FA8F5; --blue-soft:#1B2C47;
      --live:#FF6B61; --live-soft:#3D1B18;
      --amber:#FDBA74; --amber-soft:#3A2A14;
      --shadow:0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.display{font-family:"Archivo",system-ui,sans-serif;line-height:1.08;margin:0}
  p{margin:0}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;min-height:44px}
  img{display:block;max-width:100%}
  .wrap{max-width:1240px;margin:0 auto;padding:0 18px}
  .num{font-family:"Archivo Narrow","Archivo",sans-serif;font-variant-numeric:tabular-nums}

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;background:#0A0F07;color:var(--hero-ink)}
  .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,4,.38) 0%,rgba(6,10,4,.55) 55%,rgba(6,10,4,.92) 100%)}
  .hero-in{position:relative;z-index:1;padding:52px 18px 34px}
  .hero-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  .live-dot{display:inline-flex;align-items:center;gap:8px;background:rgba(10,14,7,.72);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:.82rem;letter-spacing:.04em}
  .live-dot i{width:9px;height:9px;border-radius:50%;background:#FF5147;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,81,71,.55)}70%{box-shadow:0 0 0 9px rgba(255,81,71,0)}100%{box-shadow:0 0 0 0 rgba(255,81,71,0)}}
  @media (prefers-reduced-motion: reduce){.live-dot i{animation:none} html{scroll-behavior:auto}}
  .hero-date{background:rgba(10,14,7,.72);border:1px solid rgba(255,255,255,.22);color:#DCE8C8;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.82rem}
  .hero h1{font-size:clamp(2.3rem,6.2vw,4.3rem);font-weight:900;letter-spacing:-.02em;max-width:13ch}
  .hero h1 em{font-style:normal;color:#C6F24E}
  .hero .sub{margin-top:16px;max-width:56ch;font-size:clamp(1rem,2.2vw,1.18rem);color:#E3EBD3;font-weight:500}
  .hero .sub strong{color:#fff}
  .hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px}
  .hstat{background:rgba(10,14,7,.68);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;backdrop-filter:blur(4px)}
  .hstat b{display:block;font-family:"Archivo",sans-serif;font-size:1.55rem;font-weight:900;color:#fff;line-height:1}
  .hstat span{display:block;margin-top:6px;font-size:.8rem;font-weight:700;color:#BCCBA6;letter-spacing:.02em}
  @media (max-width:640px){.hero-stats{grid-template-columns:1fr 1fr}.hero-in{padding:38px 0 26px}}

  /* ---------- TOOLBAR ----------
     Empleado 2, 24 nov 2026 — la barra ya NO es fija: con position:sticky
     tapaba el borde superior del contenido al bajar (la etiqueta "Momio
     decimal de la casa" de la calculadora y la parte alta de una tarjeta).
     Ahora va en flujo normal y se va con la página; nada queda tapado. */
  .toolbar{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
  .toolbar-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .days{display:flex;flex-wrap:wrap;gap:8px}
  .day{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:12px;padding:8px 14px;font-weight:800;font-size:.86rem;min-height:44px}
  .day small{display:block;font-weight:600;font-size:.68rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .day[aria-pressed="true"] small{color:var(--muted)}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:.86rem;min-height:44px}
  .tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* ---------- LAYOUT ---------- */
  .layout{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:22px;padding:26px 0 10px;align-items:start}
  @media (max-width:1080px){.layout{grid-template-columns:200px minmax(0,1fr)} .rail{grid-column:1/-1;order:3}}
  @media (max-width:720px){.layout{grid-template-columns:1fr} .rail{order:0}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-h{padding:16px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .panel-h h2{font-size:1.02rem;font-weight:800;letter-spacing:-.01em}
  .panel-h span{font-size:.76rem;font-weight:700;color:var(--muted)}

  /* Leagues */
  .leagues{list-style:none;margin:0;padding:6px 10px 14px;display:flex;flex-direction:column;gap:2px}
  @media (max-width:720px){.leagues{flex-direction:row;flex-wrap:wrap;padding:6px 12px 14px}}
  .league-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:10px;padding:9px 10px;text-align:left;color:var(--ink);font-weight:700;font-size:.9rem;min-height:44px}
  @media (max-width:720px){.league-btn{width:auto;border:1px solid var(--line)}}
  .league-btn:hover{background:var(--surface-2)}
  .league-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong)}
  .flag{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:900;font-size:.62rem;background:var(--surface-3);color:var(--ink-2)}
  .league-btn[aria-pressed="true"] .flag{background:var(--accent);color:var(--on-accent)}
  .league-btn .cnt{margin-left:auto;font-size:.74rem;color:var(--muted);font-weight:800}
  @media (max-width:720px){.league-btn .cnt{display:none}}

  /* Match cards */
  .agenda-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .agenda-head h2{font-size:1.45rem;font-weight:900;letter-spacing:-.02em;border-left:3px solid var(--accent);padding-left:10px}
  .demo-note{font-size:.78rem;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:7px 12px}
  .match{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;cursor:pointer}
  .match:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 14px 32px rgba(0,0,0,.35)}
  .match-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .match-top::after{content:"›";font-size:1.4rem;font-weight:900;color:var(--accent);line-height:1}
  .m-league{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .badge{font-size:.68rem;font-weight:900;letter-spacing:.06em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
  .badge-live{background:var(--live-soft);color:var(--live)}
  .badge-demo{background:var(--surface-2);color:var(--muted)}
  .badge-value{background:var(--accent-soft);color:var(--accent-strong)}
  .m-time{margin-left:auto;font-weight:800;font-size:.86rem;color:var(--ink-2)}
  .m-time.live{color:var(--live)}
  .m-time .pulse-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.6s infinite;vertical-align:1px}
  .m-time.final{color:var(--muted)}
  .teams{display:grid;gap:8px}
  .team{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px}
  .crest{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:900;font-size:.7rem;color:#fff}
  .c-a{background:#14532D}.c-b{background:#7C2D12}.c-c{background:#1E3A5F}.c-d{background:#581C87}.c-e{background:#7F1D1D}.c-f{background:#134E4A}.c-g{background:#713F12}.c-h{background:#312E81}
  .team b{font-size:1rem;font-weight:800}
  .team .score{font-family:"Archivo",sans-serif;font-size:1.25rem;font-weight:900;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
  .team .score.dim{color:var(--muted);font-size:.95rem;font-weight:700}
  .prob{margin-top:14px}
  .prob-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
  .prob-bar i{display:block;height:100%}
  .p-h{background:var(--accent)} .p-d{background:var(--surface-3)} .p-a{background:var(--blue)}
  .prob-labels{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:.74rem;font-weight:800;color:var(--muted);flex-wrap:wrap}
  .prob-labels b{color:var(--ink)}
  .match-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:800;color:var(--ink-2)}
  .chip strong{color:var(--ink)}
  .chip.ev{background:var(--accent-soft);color:var(--accent-strong)}
  .chip.ev strong{color:var(--accent-strong)}
  .chip.ev-mid{background:var(--amber-soft);color:var(--amber)}
  .chip.ev-mid strong{color:var(--amber)}
  .chip.ev-bad{background:var(--live-soft);color:var(--live)}
  .chip.ev-bad strong{color:var(--live)}
  .odds{margin-top:14px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
  .odds-add{display:flex;justify-content:flex-end;margin-top:10px}
  .sema-status.ok{background:var(--accent-soft)}
  .sema-status.ok b{color:var(--accent-strong)}
  .add-btn{margin-left:auto;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.84rem;padding:10px 16px;min-height:44px}
  .add-btn[disabled]{background:var(--accent);color:var(--on-accent);cursor:default}
  .empty{display:none;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-weight:700}

  /* Derived markets: DNB + doble oportunidad (del 1X2, sin momio) */
  .derived{margin-top:14px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
  .derived-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .derived-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media (max-width:560px){.derived-grid{grid-template-columns:repeat(3,1fr)}}
  .dcell{background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center}
  .dcell span{display:block;font-size:.66rem;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .dcell b{display:block;font-family:"Archivo",sans-serif;font-size:1.02rem;font-weight:900;margin-top:2px}
  .chip.pending{background:var(--amber-soft);color:var(--amber)}
  .chip.pending strong{color:var(--amber)}
  .badge-pending{background:var(--amber-soft);color:var(--amber)}
  .dot.pending{background:#9AA78E}
  .sema-status{display:flex;gap:10px;background:var(--amber-soft);border-radius:12px;padding:12px 13px;margin-bottom:8px}
  .sema-status b{font-size:.9rem;color:var(--amber)}
  .sema-status p{font-size:.82rem;color:var(--ink-2)}

  /* Rail / IA panel */
  .rail{display:flex;flex-direction:column;gap:18px}
  .verdict{padding:0 18px 16px}
  .sema{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .sema:first-of-type{border-top:0}
  .dot{width:13px;height:13px;border-radius:50%;margin-top:5px;flex:0 0 13px}
  .dot.g{background:#65A30D}.dot.y{background:#D97706}.dot.r{background:#D92D20}
  @media (prefers-color-scheme: dark){.dot.g{background:#BFE84A}.dot.y{background:#FDBA74}.dot.r{background:#FF6B61}}
  .sema b{font-size:.9rem}
  .sema p{font-size:.82rem;color:var(--muted)}
  .slip{padding:0 18px 18px}
  .slip-empty{color:var(--muted);font-size:.88rem;font-weight:600;padding:6px 0 2px}
  .slip-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .slip-item b{font-size:.88rem;display:block}
  .slip-item span{font-size:.78rem;color:var(--muted);font-weight:700}
  .slip-item button{margin-left:auto;background:var(--surface-2);border:0;border-radius:8px;width:36px;height:36px;min-height:36px;font-weight:900;color:var(--ink-2);flex:0 0 36px}
  .slip-totals{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:13px 14px;display:grid;gap:7px}
  .slip-totals[hidden]{display:none}
  .clear-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:10px 16px;font-weight:800;font-size:.86rem}
  .clear-btn:hover{background:var(--live-soft);color:var(--live);border-color:var(--live)}
  .slip-totals div{display:flex;justify-content:space-between;font-size:.86rem;font-weight:700;color:var(--ink-2)}
  .slip-totals div b{color:var(--ink);font-family:"Archivo",sans-serif}
  .slip-verdict{margin-top:10px;font-size:.86rem;font-weight:800;padding:11px 13px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong)}
  .slip-verdict.warn{background:var(--amber-soft);color:var(--amber)}
  .rule-note{padding:0 18px 16px;font-size:.84rem;color:var(--muted);font-weight:600}

  /* ---------- SECTIONS ---------- */
  section.block{padding:44px 0 6px}
  .sec-head{max-width:640px;margin-bottom:22px}
  .sec-head h2{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:900;letter-spacing:-.02em}
  .sec-head p{margin-top:10px;color:var(--ink-2);font-size:1.02rem}

  /* Calculator */
  .calc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
  @media (max-width:820px){.calc{grid-template-columns:1fr}}
  .calc-form{padding:26px}
  .calc-form h3{font-size:1.25rem;font-weight:900;margin-bottom:6px}
  .calc-form>p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
  .field{margin-bottom:18px}
  .field label{display:flex;justify-content:space-between;font-weight:800;font-size:.88rem;margin-bottom:8px}
  .field label output{font-family:"Archivo",sans-serif;color:var(--accent-strong)}
  input[type="range"]{width:100%;accent-color:var(--accent);height:36px}
  .field input[type="number"]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:1rem;font-weight:700;min-height:48px;font-family:inherit}
  .calc-out{background:var(--surface-2);padding:26px;display:flex;flex-direction:column;gap:12px}
  .calc-out .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:10px}
  .calc-out .row span{font-size:.86rem;font-weight:700;color:var(--ink-2)}
  .calc-out .row b{font-family:"Archivo",sans-serif;font-size:1.3rem;font-weight:900}
  .calc-verdict{margin-top:auto;border-radius:14px;padding:15px 16px;font-weight:800;font-size:.95rem;background:var(--accent-soft);color:var(--accent-strong)}
  .calc-verdict.neg{background:var(--live-soft);color:var(--live)}
  .calc-verdict.mid{background:var(--amber-soft);color:var(--amber)}
  .calc-img{position:relative;min-height:210px}
  .calc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  @media (max-width:820px){.calc-img{min-height:180px;order:-1}}

  /* Markets */
  .markets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:900px){.markets{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.markets{grid-template-columns:1fr}}
  .market{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .market .tag{display:inline-block;font-family:"Archivo",sans-serif;font-weight:900;font-size:.78rem;letter-spacing:.05em;background:var(--ink);color:var(--bg);border-radius:8px;padding:5px 10px;margin-bottom:12px}
  .market h3{font-size:1.08rem;font-weight:800;margin-bottom:8px}
  .market p{font-size:.9rem;color:var(--ink-2)}
  .market p+p{margin-top:8px;font-size:.84rem;color:var(--muted)}

  /* Two col: estilo + cómo decide */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
  .card h3{font-size:1.2rem;font-weight:900;margin-bottom:14px}
  .rules{list-style:none;margin:0;padding:0;display:grid;gap:0}
  .rules li{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
  .rules li:first-child{border-top:0;padding-top:2px}
  .rules .n{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:900;font-size:.85rem}
  .rules b{display:block;font-size:.96rem}
  .rules p{font-size:.87rem;color:var(--muted)}
  .steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
  .steps li{padding:13px 0;border-top:1px solid var(--line)}
  .steps li:first-child{border-top:0;padding-top:2px}
  .steps b{font-size:.96rem;display:flex;gap:9px;align-items:center}
  .steps b::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--blue);flex:0 0 9px}
  .steps p{font-size:.87rem;color:var(--muted);margin-top:4px}

  /* Editorial strip */
  .editorial{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media (max-width:820px){.editorial{grid-template-columns:1fr}}
  .story{position:relative;border-radius:22px;overflow:hidden;min-height:300px;background:#0A0F07;color:#fff;display:flex;align-items:flex-end}
  .story img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
  .story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(5,8,3,.88))}
  .story-in{position:relative;z-index:1;padding:24px}
  .story-in .k{font-size:.72rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#C6F24E}
  .story-in h3{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:900;margin-top:8px;max-width:22ch}
  .story-in p{margin-top:8px;color:#D8E2C6;font-size:.94rem;max-width:46ch}
  .mini-stories{display:grid;gap:14px}

<script>

const MarcadorEnVivo = (() => {
  const BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer';
  const ALT_BASE = 'https://site.web.api.espn.com/apis/site/v2/sports/soccer';
  const CACHE_URL = 'data/vivo.json';
  const CACHE_TIMEOUT_MS = 3000;

  let elActual = null;

  function normNombre(s) {

  // ("88'"), estado pre/in/post y actualizado_en por partido. Se aceptan
  // también los campos del demo de E2 (goles_local, minuto numérico) por
  // compatibilidad, pero el archivo real manda.

      const min = minutoDe(q.minuto != null ? q.minuto : q.minute);

  async function pedirScoreboard(base, liga, fecha) {

  function textoEstado(e, t, home, away) {

      // seguir diciendo "menos de 1 min".

      return '<div class="detail-pending">pendiente — aún no hay XI probable publicado para este equipo.</div>';
    }
    var sinPos = xi.j.filter(function(p){ return p[1] === "?"; }).length; if (!xi.fm || xi.fm === "—" || sinPos >= 5){ var h2 = '<div class="pitch" aria-label="Alineación: ' + esc(xi.e) + '">'; h2 += '<div class="pitch-head"><b>' + esc(xi.e) + '</b><span>' + esc(rol) + ' · Formación por confirmar</span></div>'; h2 += '<ul class="detail-list">'; xi.j.forEach(function(p){ h2 += '<li>' + esc(p[0]) + '</li>'; }); h2 += '</ul><p class="pitch-note">Alineación oficial: posiciones por confirmar.</p></div>'; return h2; } /* Novena ronda P0-3: sin formación o sin posiciones, la cancha se rompe (los "?" se apilan en una fila); respaldo limpio con la lista de los 11 nombres. */ var grupos = [["F", "Delanteros"], ["M", "Mediocampistas"], ["D", "Defensas"], ["G", "Portero"], ["?", "Posición por confirmar"]];
    var h = '<div class="pitch" aria-label="Alineación en cancha: ' + esc(xi.e) + '">';
    h += '<div class="pitch-head"><b>' + esc(xi.e) + '</b><span>' + esc(rol) + ' · Formación ' + esc(xi.fm) + (xi.of ? ' · Oficial' : ' · Probable') + '</span></div>';
    grupos.forEach(function(g){
      var jug = xi.j.filter(function(p){ return p[1] === g[0]; });
      if (!jug.length) return;
      h += '<div class="pitch-row" aria-label="' + esc(g[1]) + '">';
      jug.forEach(function(p){
        h += '<div class="pitch-player"><span class="pitch-dot">' + esc(p[1]) + '</span><span class="pitch-name">' + esc(p[0]) + '</span></div>';
      });
      h += '</div>';
    });
    h += '<p class="pitch-note">Los 11 parados por posición (arriba los delanteros, abajo el portero). Sin fotos.</p></div>';
    return h;
  }

  /* Semana 10 (E2): XI oficial de data/mapas.json; posiciones ESPN (CD-L, LB, AM-R...) se normalizan a G/D/M/F; la formación se calcula D-M-F. */ function posCancha(p){ p = (p || "").toUpperCase(); if (p === "G" || p === "GK") return "G"; if (p === "F" || p.indexOf("CF") === 0 || p === "LF" || p === "RF" || p === "ST") return "F"; if (p.indexOf("CD") === 0 || p === "LB" || p === "RB" || p === "SW" || p === "DF") return "D"; if (p === "DM" || p.indexOf("CM") === 0 || p === "AM" || p === "LM" || p === "RM" || p.indexOf("AM-") === 0 || p === "MF") return "M"; return "?"; } function xiOficial(lista, equipo){ var j = []; (lista || []).forEach(function(p){ if (!p || p.jugador == null || p.jugador === "") return; j.push([p.jugador, posCancha(p.pos), (p.dorsal == null ? "" : String(p.dorsal))]); }); var nD = 0, nM = 0, nF = 0; j.forEach(function(p){ if (p[1] === "D") nD++; else if (p[1] === "M") nM++; else if (p[1] === "F") nF++; }); var fm = (nD + nM + nF === 10) ? (nD + "-" + nM + "-" + nF) : "—"; return {e: equipo || "", fm: fm, of: true, j: j}; } function pitchBlock(key){
    var h = "<h4>Alineación en cancha</h4>";
    var d = DETAIL[key] || null; var lin = d && d.lineup; if (lin && lin.alineacion_publicada && lin.jugadores && lin.jugadores.local && lin.jugadores.visita && lin.jugadores.local.length === 11 && lin.jugadores.visita.length === 11){ h = "<h4>Alineación oficial en cancha</h4>"; h += '<p class="detail-note">Alineación oficial publicada por ESPN — los 11 titulares de cada equipo.</p>'; h += '<div class="pitch-grid">' + pitchXI(xiOficial(lin.jugadores.local, d.home), "Local") + pitchXI(xiOficial(lin.jugadores.visita, d.away), "Visita") + '</div>'; return h; } h += '<p class="detail-note">Alineación oficial: por confirmar — ESPN aún no publica los 11 titulares.</p>'; var m = XI_PROBABLE[key];
    if (!m){
      return h + '<div class="detail-pending">pendiente — aún no hay XI probable publicado para este partido.</div>';
    }
    h += '<div class="pitch-grid">' + pitchXI(m.hx, "Local") + pitchXI(m.vx, "Visita") + '</div>';
    return h;
  }

  /* ---------- Últimos 5, H2H y tabla (DETAIL embebido, ESPN 23 nov) ---------- */
  function lastFiveBlock(key, home, away){
    var h = "<h4>Últimos 5 partidos</h4><div class=\"detail-two\">";
    var d = DETAIL[key] || null;
    if (d && d.lastFive){ h += lastFiveList(home, d.lastFive.home) + lastFiveList(away, d.lastFive.away); }
    else { h += lastFiveList(home, null) + lastFiveList(away, null); }
    h += "</div>";
    return h;
  }

  function h2hBlock(key){
    var h = "<h4>Historial directo (H2H)</h4>";
    var d = DETAIL[key] || null;
    if (!d){
      return h + '<div class="detail-pending">pendiente — los enfrentamientos previos aún no se han consultado para este partido.</div>';
    }
    if (d.h2h && d.h2h.partidos && d.h2h.partidos.length){
      h += "<p><b>" + esc(d.h2h.resumen) + "</b> · " + esc(d.h2h.etiqueta) + "</p><div class=\"detail-list\"><ul>";
      d.h2h.partidos.forEach(function(mm){
        h += "<li><span class=\"d-date\">" + esc(mm.fecha) + "</span><span><b>" + esc(mm.local) +
          " " + esc(mm.goles_local) + "–" + esc(mm.goles_visitante) + " " + esc(mm.visitante) +
          "</b></span></li>";
      });
      h += "</ul></div>";
    } else {
      h += "<p>Sin enfrentamientos previos registrados en ESPN.</p>";
    }
    return h;
  }

  function standingsBlock(key, home, away){
    var h = "<h4>Posición en la tabla</h4><div class=\"detail-pos\">";
    var d = DETAIL[key] || null;
    if (d && d.standings){ h += posBox(home, d.league, d.standings.home) + posBox(away, d.league, d.standings.away); }
    else { h += posBox(home, "", null) + posBox(away, "", null); }
    h += "</div>";
    return h;
  }

  /* ---------- Estadísticas del partido en barras comparadas ---------- */
  var STATS_ETIQUETAS = {
    posesion: "Posesión", tiros: "Tiros", tiros_a_puerta: "Tiros a puerta",
    tiros_fuera: "Tiros fuera", duelos_ganados: "Duelos ganados",
    corners: "Córners", faltas: "Faltas", fueras_de_juego: "Fueras de juego",
    tarjetas_amarillas: "Tarjetas amarillas", tarjetas_rojas: "Tarjetas rojas",
    pases: "Pases", pases_precisos: "Pases precisos", pases_clave: "Pases clave",
    entradas: "Entradas", despejes: "Despejes", paradas: "Paradas",
    centros: "Centros", tiros_bloqueados: "Tiros bloqueados"
  };
  var STATS_ORDEN = ["posesion", "tiros", "tiros_a_puerta", "duelos_ganados",
    "corners", "faltas", "fueras_de_juego", "tarjetas_amarillas",
    "tarjetas_rojas", "pases_precisos", "paradas"];

  function normalizarStats(raw){
    var lista = [];
    if (Array.isArray(raw)){
      raw.forEach(function(s){
        if (!s || typeof s.local !== "number" || typeof s.visita !== "number") return;
        lista.push({clave: s.clave || "", etiqueta: s.etiqueta || STATS_ETIQUETAS[s.clave] || s.clave,
          local: s.local, visita: s.visita, unidad: s.unidad || ""});
      });
    } else if (raw && typeof raw === "object"){
      Object.keys(raw).forEach(function(k){
        var v = raw[k], l = null, vv = null, u = "";
        if (Array.isArray(v) && v.length >= 2){ l = v[0]; vv = v[1]; }
        else if (v && typeof v === "object"){ l = v.local; vv = v.visita; u = v.unidad || ""; }
        if (typeof l !== "number" || typeof vv !== "number") return;
        lista.push({clave: k, etiqueta: STATS_ETIQUETAS[k] || k, local: l, visita: vv, unidad: u});
      });
    }
    lista.sort(function(a, b){
      var ia = STATS_ORDEN.indexOf(a.clave), ib = STATS_ORDEN.indexOf(b.clave);
      if (ia === -1) ia = 99;
      if (ib === -1) ib = 99;
      return ia - ib;
    });
    return lista;
  }

  function buscarStats(docs, slug){
    var found = null;
    docs.forEach(function(doc){
      if (!doc || !Array.isArray(doc.partidos)) return;
      doc.partidos.forEach(function(p){
        if (!p) return;
        var key = p.slug ? String(p.slug).toLowerCase() : (norm(p.local) + "-vs-" + norm(p.visita));
        if (key === slug) found = p;
      });
    });
    return found;
  }

  function statsBlock(estDocs, slug, home, away){
    var h = "<h4>Estadísticas del partido</h4>";
    var p = buscarStats(estDocs, slug);
    if (!p || !p.estadisticas){
      statsState = "pendiente";
      return h + '<div class="detail-pending">Estadísticas pendientes — aún no hay estadísticas publicadas para este partido. Cuando llegue, esta sección muestra posesión, tiros, tiros a puerta, córners y el resto en barras comparadas.</div>';
    }
    var lista = normalizarStats(p.estadisticas);
    if (!lista.length){
      statsState = "sin-datos";
      return h + '<div class="detail-pending">Estadísticas pendientes — el archivo de estadísticas no trae datos para este partido.</div>';
    }
    statsState = "ok";
    h += '<div class="radio-head"><span>' + esc(home) + '</span><span class="radio-vs">vs</span><span>' + esc(away) + '</span></div>';
    lista.forEach(function(s){
      var esPct = (s.unidad === "%") || (s.clave === "posesion");
      var fmt = function(v){ return esPct ? (Math.round(v * 10) / 10) + "%" : String(v); };
      var hw, aw;
      if (esPct){
        hw = Math.max(0, Math.min(100, Math.round(s.local)));
        aw = Math.max(0, Math.min(100, Math.round(s.visita)));
      } else {
        var mx = Math.max(s.local, s.visita);
        hw = mx ? Math.round(s.local / mx * 100) : 0;
        aw = mx ? Math.round(s.visita / mx * 100) : 0;
      }
      h += radioRow(s.etiqueta, fmt(s.local), fmt(s.visita), hw, aw);
    });
    h += '<p class="detail-note">Estadísticas del partido terminado, según ESPN (resumen del partido).</p>';
    return h;
  }

  /* ---------- Render principal ---------- */
  function renderDetalle(m, estDocs){
    var li = ligaInfo(m.liga);
    var di = dayInfo(m.fecha);
    document.title = m.home + " vs " + m.away + " — Football AI Agenda";
    var h = "";
    h += headerHTML(m, di, li);
    h += '<div class="detail-body">';
    h += oddsBlock(m);
    if (m.estado_partido !== "post" && !(m.estado_partido === "in" && typeof m._minuto === "string" && /^90/.test(m._minuto.trim()))) h += htmlBSD(m); /* Novena ronda P1-2: un partido terminado o en descuento no muestra EV ni picks en el bloque BSD. */
    h += bttsBlock(m);
    h += pitchBlock(slug);
    h += fuerzaXIBlock(slug, m.home, m.away);
    h += lastFiveBlock(slug, m.home, m.away);
    h += h2hBlock(slug);
    h += radiografiaBlock(m.home, m.away, slug);
    h += standingsBlock(slug, m.home, m.away);
    h += statsBlock(estDocs, slug, m.home, m.away);
    // Empleado 2, 25 nov 2026: sección "Más análisis" retirada; estaba vacía (solo decía "Espacio reservado..."). Vuelve cuando el modelo tenga análisis real.
    h += '<p class="detail-note">Datos: data/ (partidos, momios, XI probable y Radiografía) y ESPN (consultado 23–24 nov 2026). Últimos 5, historial y tabla son datos reales; lo no verificado se muestra como pendiente.</p>';
    h += '</div>';
    root.innerHTML = h;
    wireParlay();
    initVivo(m);
    window.__detalle = {
      slug: slug, ok: true, home: m.home, away: m.away,
      liga: m.liga, fecha: m.fecha, estado: m.estado,
      xi: !!XI_PROBABLE[slug], radio: !!RADIO[slug], detail: !!DETAIL[slug],
      vivo: !!window.__detalle.vivo,
      btts: !!(m.mercados && m.mercados.btts && typeof m.mercados.btts.p_btts === "number"),
      stats: statsState,
      stopVivo: function(){ if (typeof MarcadorEnVivo !== "undefined") MarcadorEnVivo.stop(); }
    };
  }

  function main(){
    if (!slug){
      errorPage("Falta el partido: abre el detalle desde una tarjeta de la agenda (partido.html?partido=local-vs-visita).");
      return;
    }
    Promise.all([
      fetchJSON(URLS.ev.mw), fetchJSON(URLS.ev.fs),
      fetchJSON(URLS.xi.mw), fetchJSON(URLS.xi.fs),
      fetchJSON(URLS.raw.mw), fetchJSON(URLS.raw.fs),
      fetchJSON(URLS.tendencias.mw), fetchJSON(URLS.tendencias.fs),
      fetchJSON(URLS.est.mw), fetchJSON(URLS.est.fs), fetchJSON(URLS.mapas), cargarBSD(), fetchJSON("data/vivo.json") /* Novena ronda P0-1: vivo.json para marcar terminados y en descuento al renderizar la ficha. */
    ]).then(function(res){
      var partidos = [];
      [[res[0], "mw"], [res[1], "fs"]].forEach(function(pair){
        var doc = pair[0];
        if (doc && Array.isArray(doc.partidos)){
          doc.partidos.forEach(function(p){
            if (!p || !p.home || !p.away) return;
            p._cfg = pair[1];
            p._semana = doc.semana;
            partidos.push(p);
          });
        }
      });
      var m = null;
      partidos.forEach(function(p){
        if (norm(p.home) + "-vs-" + norm(p.away) === slug) m = p;
      });
      if (!m){
        errorPage("No hay ningún partido con ese identificador (" + slug + "). Vuelve a la agenda y abre el detalle desde su tarjeta.");
        return;
      }
      /* Novena ronda P0-1/P1-2: superponer vivo.json (ESPN, cada hora) sobre estado_partido de ev.json (corrida diaria). Solo se promueve a "post" o "in"; un "post" de ev.json nunca se degrada. Así la ficha terminada no muestra semáforo, picks ni BSD. */ var vivoD = res[12]; if (vivoD && Array.isArray(vivoD.partidos)){ vivoD.partidos.forEach(function(v){ if (!v || !v.home || !v.away) return; if (norm(v.home) + "|" + norm(v.away) !== norm(m.home) + "|" + norm(m.away)) return; if (v.estado === "post"){ m.estado_partido = "post"; if (typeof v.marcador_local === "number" && typeof v.marcador_visita === "number") m.marcador = {local: v.marcador_local, visita: v.marcador_visita}; } else if (v.estado === "in" && m.estado_partido !== "post"){ m.estado_partido = "in"; if (typeof v.minuto === "string") m._minuto = v.minuto; if (typeof v.marcador_local === "number" && typeof v.marcador_visita === "number") m.marcador = {local: v.marcador_local, visita: v.marcador_visita}; } }); } /* Tarea C, 25 nov 2026: data/mapas.json (55 partidos) se fusiona sobre los mapas embebidos (28). DETAIL embebido se conserva: generar_mapas.py lo lee de este archivo. */ if (res[10]){ var mp = res[10]; if (mp.partidos_vivo){ Object.keys(mp.partidos_vivo).forEach(function(k){ PARTIDOS_VIVO[k] = mp.partidos_vivo[k]; }); } if (mp.detalle){ Object.keys(mp.detalle).forEach(function(k){ if (!DETAIL[k]) DETAIL[k] = mp.detalle[k]; }); } } var xiMap = buildXIMap([res[2], res[3]]);
      /* Semana 10 (E2): estadio y alineación oficial (data/mapas.json, E1) se añaden a DETAIL sin tocar sus campos existentes (h2h, standings y lastFive se conservan); la fusión de arriba solo agrega las entradas nuevas. */ if (res[10] && res[10].detalle){ Object.keys(res[10].detalle).forEach(function(k){ var dd = res[10].detalle[k]; if (!dd) return; if (!DETAIL[k]) DETAIL[k] = {}; if (dd.estadio) DETAIL[k].estadio = dd.estadio; if (dd.lineup) DETAIL[k].lineup = dd.lineup; }); } if (window.__setXI) window.__setXI(xiMap);
      var radioMap = buildRADIOMap(
        {mw: res[4], fs: res[5]},
        {mw: res[6], fs: res[7]},
        partidos
      );
      if (window.__setRADIO) window.__setRADIO(radioMap);
      renderDetalle(m, [res[8], res[9]]);
    });
  }

  main();
})();

</script>
